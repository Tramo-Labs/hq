# The portal and the operator console (eng/app), their own app and domain since D-21.
# The landing is eng/web (deploy-web.yml).
name: App
on:
  push:
    branches: [main]
    paths: ["eng/app/**", "eng/ui/**", ".github/workflows/deploy-app.yml"]
  pull_request:
    paths: ["eng/app/**", "eng/ui/**", ".github/workflows/deploy-app.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # The same gates as before closing an app task: types, lint, tests and the build (sample
    # mode, no API origin). Node is the minimum the tests need (type stripping, 22.18). The
    # checkout includes eng/ui, which the app depends on.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: app-check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults: { run: { working-directory: eng/app } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: eng/app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    # Only from main (or by hand), only after the check passed, and only once the Vercel project
    # tramo-app exists: until then the repository variable TRAMO_APP_DEPLOY is not "true" and this
    # job is skipped, so main stays green. Whoever creates the project sets, in the repository,
    # TRAMO_APP_DEPLOY=true and VERCEL_APP_PROJECT_ID, and in the project NEXT_PUBLIC_API_BASE
    # (the core's API origin, https; vercel pull brings it into the build).
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      vars.TRAMO_APP_DEPLOY == 'true'
    needs: [check]
    runs-on: ubuntu-latest
    concurrency: { group: deploy-app, cancel-in-progress: true }
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_APP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22.18" }
      # The same pinned CLI as deploy-web.yml (65.2.0, at least two weeks old when chosen).
      - run: npm i -g vercel@65.2.0
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
