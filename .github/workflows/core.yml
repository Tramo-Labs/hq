name: Core
on:
  push:
    branches: [main]
    paths: ["eng/core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["eng/core/**", ".github/workflows/core.yml"]

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: eng/core } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history and origin/main: migrations are checked against
          # main's highest version (migrations/order_test.go).
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: eng/core/go.mod
          cache-dependency-path: eng/core/go.sum
      # Pinned generators and checkers (versions in the Makefile), into ./bin.
      - run: make tools tools-sec
      - name: Lint (gofmt, go vet, buf lint)
        run: make lint
      - name: Generated code is up to date
        run: make gen-check
      - run: make build
      # Database tests run on an embedded Postgres 17 (no service container).
      - name: Tests with the race detector
        run: make test
      - name: Security (gosec, govulncheck)
        run: make sec

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: eng/core/deploy/terraform } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
      # Providers only; no backend, no credentials, no plan.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  image:
    # One image, three binaries; tagged with the commit sha. Only on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Image name (GHCR needs lowercase)
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/tramo-core" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: eng/core
          file: eng/core/deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
