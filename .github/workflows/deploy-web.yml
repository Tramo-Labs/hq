# The landing (eng/web), alone since D-21. The portal and the console are eng/app (deploy-app.yml).
name: Web
on:
  push:
    branches: [main]
    paths: ["eng/web/**", "eng/ui/**", ".github/workflows/deploy-web.yml"]
  pull_request:
    paths: ["eng/web/**", "eng/ui/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # The same gates as before closing a landing task: types, lint and the build. The landing has
    # no tests (they all moved to eng/app). The checkout includes eng/ui, which it depends on.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: web-check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults: { run: { working-directory: eng/web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: eng/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    # Only from main (or by hand), and only after the check passed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    concurrency: { group: deploy-web, cancel-in-progress: true }
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22.18" }
      # Exact version, like the pinned actions: 65.2.0 (npm, 2026-10-22), chosen at least two
      # weeks old. Raise it on purpose, not on every run.
      - run: npm i -g vercel@65.2.0
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
