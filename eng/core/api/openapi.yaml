openapi: 3.0.3
info:
  title: Tramo Core API
  version: 0.1.0
  description: |
    REST contract of the core. Spec first: handlers are generated from this
    file with oapi-codegen (`make gen`) and nobody edits the generated code.

    Conventions every module follows:
    - Every POST that creates a resource declares the `IdempotencyKey`
      parameter (eng/ARQUITECTURA.md section 7). A test fails otherwise.
    - Errors are `application/problem+json` (RFC 9457) with a stable `code`.
    - Amounts are integers in cents; dates and times are ISO 8601.
    - Lists are wrapped: `{items: [...], nextCursor}`.
servers:
  - url: http://localhost:8080
tags:
  - name: platform
  - name: identity
  - name: ledger
    description: Bank and Mercado Pago accounts, statement uploads, quarantine.
  - name: documents
    description: Supplier invoices with the source and confidence of every field.
  - name: matching
    description: Runs of the matching engine, the three trays and human decisions.
  - name: closes
    description: |
      The period close of a tenant (D-6: fortnightly by default, the period
      is a parameter). An operator closes a period once its Suggested tray
      is empty; the close freezes it and stores the summary the client sees.
  - name: mercadopago
    description: |
      The client's Mercado Pago account connected by OAuth with PKCE (D-22).
      Mercado Pago returns the browser to the portal's page
      /app/mercadopago/vuelta (MP_REDIRECT_URI points there), which sends
      code and state to POST /v1/integrations/mercadopago/connect with the
      owner's session. Tokens are kept encrypted per tenant and never shown.
  - name: inbox
    description: |
      The client's own mailbox for statements (D-22): an address with a
      random code the owner can rotate, mail accepted only from senders the
      owner authorized and whose domain authenticates (SPF or DKIM aligned),
      attachments handed to ingestion. The body and the subject are never
      stored; every message leaves a receipt.
  - name: portal
    description: |
      Read views for the client portal and the operator console, built from
      the other modules. The tenant always comes from the access token: no
      operation takes a tenant id from the request.
paths:
  /healthz:
    get:
      operationId: healthz
      tags: [platform]
      summary: Liveness
      security: []
      responses:
        "204": { description: alive }
  /readyz:
    get:
      operationId: readyz
      tags: [platform]
      summary: Readiness (database reachable)
      security: []
      responses:
        "204": { description: ready }
        "503": { $ref: "#/components/responses/Problem" }

  /v1/auth/register:
    post:
      operationId: register
      tags: [identity]
      summary: Create an account, its first tenant and the owner membership
      description: |
        Returns ids only (the response is stored for idempotency, so it never
        carries tokens). Log in afterwards.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429":
          description: too many registrations from this IP (code rate_limited)
          headers:
            Retry-After: { schema: { type: integer }, description: seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/auth/login:
    post:
      operationId: login
      tags: [identity]
      summary: Exchange email and password for an access token and a refresh token
      description: |
        The access token is a 10 minute EdDSA JWT for one tenant. The refresh
        token lives 30 days and rotates on every use. With
        `tokenDelivery: cookie` (browsers) it travels only in an HttpOnly
        cookie scoped to /v1/auth; with `body` (API clients) it is returned
        in the body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "401":
          description: |
            Wrong email or password (code unauthorized), or the email is under
            a distributed password attack (code magic_link_required): 20
            failures from 3 or more IPs in 15 minutes switch it to magic link
            for an hour. In that mode the password is not checked, right or
            wrong the answer is the same; log in with POST /v1/auth/magic-link.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "403":
          description: |
            The password is right but the user is not a member of the
            requested tenant (code not_a_member).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: |
            Throttled (code rate_limited): too many logins from this IP, or
            too many failures for this email from this IP. Checked before the
            password. Never a lockout of the email for every IP. When it is
            the email and IP pair, the problem carries `magicLink: true`: the
            person can still get in with POST /v1/auth/magic-link.
          headers:
            Retry-After: { schema: { type: integer }, description: seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/auth/invite/accept:
    post:
      operationId: acceptInvite
      tags: [identity]
      summary: Accept an invitation, join the tenant and open a session
      description: |
        The token comes only in the invitation email. It is single use and
        expires in 72 hours. Accepting turns the pending membership into a
        membership and opens a session on that tenant. A person without a
        password sets one here (400 password_required without it); an
        existing account does not, and its password is never changed here.
        Unknown, used, revoked and expired tokens all answer 401
        invalid_invite; an invitation whose pending membership was removed
        answers 403 not_a_member. Rate limited per IP.

        A bearer is optional (F41). With the access token of the account
        the invitation is for, it is accepted without opening a session:
        204, the signed in session keeps its tenant, no tokens or cookies;
        no password is asked for or set. With one of another account it is
        not accepted: 409 invite_for_another_account, nothing used. An
        invalid or expired bearer is 401 unauthorized, as anywhere.
      security:
        - {}
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "204": { description: accepted with the signed in session of the same account; nothing issued }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: The pending membership was removed (code not_a_member).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: The signed in session is of another account (code invite_for_another_account).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Throttled (code rate_limited).
          headers:
            Retry-After: { schema: { type: integer }, description: seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/auth/invite/preview:
    post:
      operationId: previewInvite
      tags: [identity]
      summary: See an invitation before accepting it, without using it
      description: |
        Answers the company and the role an invitation is for, so the web
        can show them before the person accepts (F38). Nothing else: not
        the email, not whether the person has an account. Uses nothing:
        the token stays valid and the membership stays pending. The token
        goes in the body, never in the URL, so it does not reach a log.
        Same answers as POST /v1/auth/invite/accept: unknown, used, revoked
        and expired tokens all answer 401 invalid_invite; an invitation
        whose pending membership was removed answers 403 not_a_member.
        It shares accept's per IP cap: every preview counts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreviewInviteRequest" }
      responses:
        "200":
          description: the invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: The pending membership was removed (code not_a_member).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Throttled (code rate_limited).
          headers:
            Retry-After: { schema: { type: integer }, description: seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/auth/magic-link:
    post:
      operationId: requestMagicLink
      tags: [identity]
      summary: Email a one time login link
      description: |
        Always answers 202, whether or not the email has an account, so it
        does not reveal which emails exist. If it does, a single use link
        valid for 15 minutes goes to that email. Throttled per IP and per
        email (sending, not logging in).
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkRequest" }
      responses:
        "202": { description: accepted; a link was sent if the email has an account }
        "400": { $ref: "#/components/responses/Problem" }
        "429":
          description: Throttled (code rate_limited).
          headers:
            Retry-After: { schema: { type: integer }, description: seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/auth/magic-link/accept:
    post:
      operationId: acceptMagicLink
      tags: [identity]
      summary: Open a session with a magic link
      description: |
        The token comes only in the email. Unknown, used and expired tokens
        all answer 401 invalid_magic_link. Opens a session on the tenant
        asked for when the link was requested, or the oldest membership.
        Clears that email's failures from this IP. Rate limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkAcceptRequest" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403":
          description: The tenant asked for is not one of the person's (code not_a_member).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Throttled (code rate_limited).
          headers:
            Retry-After: { schema: { type: integer }, description: seconds to wait }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/auth/refresh:
    post:
      operationId: refresh
      tags: [identity]
      summary: Rotate the refresh token and get a new access token
      description: |
        Send the refresh token in the cookie or in the body. A refresh token
        that was already used revokes its whole family (theft detected) and
        answers 401. When the refresh cookie is sent, the request must come
        from an allowed browser origin (the CORS list, ADR 0007): a missing
        or foreign Origin answers 403 origin_not_allowed and the token is
        not touched. A token in the body (no cookie) needs no Origin.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/auth/switch-tenant:
    post:
      operationId: switchTenant
      tags: [identity]
      summary: Move the session to another of the caller's tenants, no password
      description: |
        Authenticated by the refresh token (cookie or body), like refresh: a
        stolen 10 minute access token can not open sessions elsewhere. The
        token rotates within the same family, now bound to the new tenant,
        and a new access token for it comes back. The role is read from the
        membership. A tenant the caller does not belong to answers 403
        not_a_member and leaves the token as it was. With the refresh
        cookie, the request must come from an allowed origin (403
        origin_not_allowed). Works for people who sign in by magic link and
        have no password.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchTenantRequest" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [identity]
      summary: Revoke the refresh token family of this session
      description: |
        Same Origin rule as refresh: with the refresh cookie, a missing or
        foreign Origin answers 403 origin_not_allowed and nothing is revoked.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204":
          description: logged out
          headers:
            Set-Cookie: { schema: { type: string }, description: clears the refresh cookie }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: The caller, the active tenant and every membership
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updateMe
      tags: [identity]
      summary: Set the caller's own name
      description: |
        Only the caller's own name, whatever the role. Leading and trailing
        spaces are trimmed; empty after trimming, or with control
        characters, answers 400 invalid_name. Audited without the value.
        Changes nothing that could be replayed, so no Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/tenant/members:
    get:
      operationId: listMembers
      tags: [identity]
      summary: Members of the active tenant
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
                  nextCursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: addMember
      tags: [identity]
      summary: Add a person to the active tenant (owner, or operator for the first owner)
      description: |
        An owner grants `owner`, `approver`, `viewer` or `accountant`. An
        operator grants only `owner`, and only while the tenant has none.
        Nobody grants `operator` here (the first one comes from the
        `api create-operator` command). Anything else is 403.

        Adding is always an invitation (D-19), for a new email and for an
        existing account alike: the membership stays pending, giving no
        access and not showing in the person's switcher, until they accept
        with the single use link mailed to them (never in this response,
        POST /v1/auth/invite/accept). Nothing in the person's account is
        written. Adding someone already pending sends a fresh invitation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMemberRequest" }
      responses:
        "201":
          description: invited; the member has status pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/tenant/members/{userId}:
    delete:
      operationId: removeMember
      tags: [identity]
      summary: Remove a person from the active tenant (owner only)
      description: |
        Only an owner removes, any role including an operator. The last
        owner can not be removed (409 last_owner). The person's refresh
        tokens for this tenant are revoked at once; an access token already
        issued keeps working until it expires, at most 10 minutes.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/ledger/accounts:
    get:
      operationId: listAccounts
      tags: [ledger]
      summary: Accounts of the active tenant
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
                  nextCursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAccount
      tags: [ledger]
      summary: Register a bank or Mercado Pago account (owner or operator)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/ledger/accounts/{accountId}/statements:
    post:
      operationId: uploadStatement
      tags: [ledger]
      summary: Upload a statement export of the account
      description: |
        The file enters whole or not at all (internal/ledger/README.md).
        201 with status `accepted` or `quarantined`: the file was recorded.
        200 with status `duplicate`: the same file was already accepted and
        nothing was created. Quarantined files never reach matching.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: recorded (accepted or quarantined)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "200":
          description: duplicate file, nothing created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /v1/ledger/quarantine:
    get:
      operationId: listQuarantine
      tags: [ledger]
      summary: Files that did not enter, with the reason
      description: |
        Newest first. The detail names lines, columns and fingerprints; for a balance that does
        not close it also names the amounts that disagree, so the tenant can fix its own file.
        The detail is shown to the tenant and never logged nor written to the audit log.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/QuarantinedFile" }
                  nextCursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/ledger/files:
    get:
      operationId: listFiles
      tags: [ledger]
      summary: Statement files uploaded, accepted or quarantined, newest first
      description: |
        The "Archivos" list of the portal (product spec section 4): when,
        who uploaded it, and what happened. `period` keeps the files
        received in that month (Argentina time). Every role of the tenant
        sees it. `uploadedByEmail` is absent when the uploader is no longer
        a member of the tenant (or for files from before it was recorded).
        Up to 500 rows; `truncated` says there were more.
      parameters:
        - $ref: "#/components/parameters/PeriodFilter"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [accepted, quarantined] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UploadedFile" }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/ledger/movements:
    get:
      operationId: listMovements
      tags: [ledger]
      summary: Movements of one month, in date and line order
      description: |
        The movements stored for the tenant with a date in `period`
        (required), optionally of one account. Every role of the tenant
        sees them. Up to 5000 rows; `truncated` says there were more
        (filter by account).
      parameters:
        - name: period
          in: query
          required: true
          description: A month, YYYY-MM.
          schema: { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$", example: "2026-11" }
        - name: accountId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LedgerMovement" }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/documents/invoices:
    get:
      operationId: listInvoices
      tags: [documents]
      summary: Invoices of the active tenant, newest first
      description: |
        `period` keeps the invoices stored in that month; `autoEligible=false`
        keeps the ones that need review (some required field missing, not
        trusted or in conflict). The rows behind the invoice metrics.
      parameters:
        - $ref: "#/components/parameters/PeriodFilter"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
        - name: autoEligible
          in: query
          required: false
          schema: { type: boolean }
        - name: review
          in: query
          required: false
          description: Only invoices to review, those not eligible for automatic or that generated no open item (see itemReason).
          schema: { type: boolean }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InvoiceSummary" }
                  nextCursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: uploadInvoice
      tags: [documents]
      summary: Upload a supplier invoice (PDF or image)
      description: |
        Read in order: ARCA QR, PDF text. OCR and language model are not
        configured. 409 `conflict` when the same file or the same invoice
        (issuer, type, point of sale and number, from trusted fields) is
        already stored.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
  /v1/documents/invoices/{invoiceId}:
    get:
      operationId: getInvoice
      tags: [documents]
      summary: An invoice with every field's source and confidence
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/closes:
    get:
      operationId: listCloses
      tags: [closes]
      summary: The closed periods of the active tenant, newest first
      description: |
        Every role of the tenant sees them. Each carries its frozen summary.
        Pages of 50; pass nextCursor as cursor for the next one.
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: closes
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Close" }
                  nextCursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: closePeriod
      tags: [closes]
      summary: Close a period of the active tenant (operator)
      description: |
        Freezes the period that starts on periodStart, per the tenant's
        cadence (fortnight by default: the 1st to the 15th and the 16th to
        the month's last day), and stores its summary. Only an operator
        closes. Refused, with nothing written:
        - 409 suggested_pending: the period still has Suggested items; the
          answer carries how many, and the operator empties the tray first.
          Open Exceptions do not block: they go into the summary.
        - 409 already_closed: that period is closed.
        - 409 period_not_over: the period has not ended yet.
        - 400 invalid_period: periodStart is not where a period starts.
        Once closed, decisions, reverts, manual links and runs that touch
        the period answer 409 period_closed. Reopening is not built.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClosePeriodRequest" }
      responses:
        "201":
          description: closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Close" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409":
          description: |
            Not closed (codes suggested_pending, already_closed,
            period_not_over). suggested_pending carries pendingSuggested.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/CloseRefused" }
  /v1/closes/{closeId}:
    get:
      operationId: getClose
      tags: [closes]
      summary: One closed period of the active tenant, with its summary
      parameters:
        - name: closeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: the close
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Close" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/integrations/mercadopago:
    get:
      operationId: getMercadoPago
      tags: [mercadopago]
      summary: The tenant's Mercado Pago connection
      description: Owner, accountant and operator. Never carries a token.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MercadoPagoConnection" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    delete:
      operationId: disconnectMercadoPago
      tags: [mercadopago]
      summary: Forget the connection and its tokens (owner)
      description: |
        Deletes the tokens here. Mercado Pago documents no endpoint for an
        integrator to revoke an authorization: the owner also removes the
        app from their Mercado Pago account to end it there (the answer's
        revokeInMercadoPago says so).
      responses:
        "200":
          description: disconnected here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MercadoPagoConnection" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/integrations/mercadopago/authorize:
    post:
      operationId: authorizeMercadoPago
      tags: [mercadopago]
      summary: Start connecting Mercado Pago (owner)
      description: |
        Returns the Mercado Pago URL to send the browser to. It carries a
        state (random, single use, 10 minutes) and a PKCE S256 challenge;
        the verifier stays here, encrypted. 501 not_configured while the
        app's credentials are not set (after the role check).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: where to send the browser
          content:
            application/json:
              schema:
                type: object
                required: [authorizeUrl, expiresAt]
                properties:
                  authorizeUrl: { type: string }
                  expiresAt: { type: string, format: date-time, description: When the state stops being accepted. }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
  /v1/integrations/mercadopago/connect:
    post:
      operationId: connectMercadoPago
      tags: [mercadopago]
      summary: Finish connecting with the code Mercado Pago returned (owner)
      description: |
        The portal's return page sends what Mercado Pago put in its URL.
        Refused, with nothing stored: 400 state_invalid (unknown state),
        403 state_not_yours (started by another person or for another
        tenant), 409 state_expired (older than 10 minutes), 409 state_used
        (already spent), 422 mp_code_rejected (Mercado Pago refused the
        code: expired, used or not for this app), 502 mp_unavailable
        (Mercado Pago did not answer properly; start again), 501
        not_configured. Connecting again replaces the previous tokens.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectMercadoPagoRequest" }
      responses:
        "201":
          description: connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MercadoPagoConnection" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /v1/inbox:
    get:
      operationId: getInbox
      tags: [inbox]
      summary: The tenant's statement mailbox, its address and authorized senders
      description: |
        Owner, accountant and operator. address is null until the owner
        creates one (POST /v1/inbox/address).
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inbox" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/inbox/address:
    post:
      operationId: rotateInboxAddress
      tags: [inbox]
      summary: Create the mailbox address, or replace it with a new one (owner)
      description: |
        A new random code every time. The previous address stops accepting
        mail at once; mail sent to it later is dropped without a receipt.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: the new address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inbox" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/inbox/senders:
    post:
      operationId: addInboxSender
      tags: [inbox]
      summary: Authorize a sender for the mailbox (owner)
      description: |
        Mail is accepted only from an authorized sender whose domain
        authenticates (SPF or DKIM aligned with the From). Adding one that
        is already authorized answers 409 already_authorized.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddInboxSenderRequest" }
      responses:
        "201":
          description: authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxSender" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/inbox/senders/{senderId}:
    delete:
      operationId: removeInboxSender
      tags: [inbox]
      summary: Stop accepting mail from a sender (owner)
      parameters:
        - name: senderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/inbox/receipts:
    get:
      operationId: listInboxReceipts
      tags: [inbox]
      summary: Receipts of the mail the mailbox got, newest first
      description: |
        Owner, accountant and operator. One per message from an authorized
        sender, and up to a daily cap for refused ones. Carries the sender
        and, per attachment, its name, size, hash and what ingestion did.
        Never the body nor the subject. The latest 200.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InboxReceipt" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/matching/runs:
    post:
      operationId: runMatching
      tags: [matching]
      summary: Run the matching engine over a month (owner or operator)
      description: |
        Matches already stored are not stored again: running the same month
        twice creates nothing new. `new` counts the matches this run added.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "201":
          description: run stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunSummary" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/matching/matches:
    get:
      operationId: listMatches
      tags: [matching]
      summary: Matches waiting in a tray
      description: |
        `auto`: registered by an exact rule, listed for review; nobody
        decides on them. `suggested`: no operator decision yet.
        `exception`: escalated by an operator, no client decision yet.
        `period` keeps the matches with a movement dated in that month.
      parameters:
        - name: tray
          in: query
          required: true
          schema: { type: string, enum: [auto, suggested, exception] }
        - $ref: "#/components/parameters/PeriodFilter"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Match" }
                  nextCursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/matching/items:
    get:
      operationId: listOpenItems
      tags: [matching]
      summary: Open items nothing settles yet, to link a movement by hand
      description: |
        The items (invoices, ERP open items) that no match in effect
        settles: no automatic match, no approved one, no manual link in
        effect. What "vincular a mano" offers. `period` keeps the items
        dated in that month (without it, every open item: an invoice of
        one month is often paid in the next). `direction=in` keeps the
        money that comes in (receivables, positive), `out` the money that
        goes out (payables, negative). Every member of the tenant sees
        them. Oldest first, up to 500; `truncated` says there were more.
      parameters:
        - $ref: "#/components/parameters/PeriodFilter"
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [in, out] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OpenItem" }
                  truncated: { type: boolean }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/matching/pending:
    get:
      operationId: listPending
      tags: [matching]
      summary: Movements waiting for a person, from the latest run of each one
      description: |
        `suggested`: ambiguous or partial evidence, with every candidate,
        for an operator. `exception`: no candidate, for the client.
        `period` keeps only the latest run of that month.
      parameters:
        - name: tray
          in: query
          required: true
          schema: { type: string, enum: [suggested, exception] }
        - $ref: "#/components/parameters/PeriodFilter"
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PendingMovement" }
                  nextCursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/matching/matches/{matchId}/decision:
    post:
      operationId: decideMatch
      tags: [matching]
      summary: Decide on a match in the Suggested or Exceptions tray
      description: |
        Suggested is decided by an operator: approve, reject (note required:
        why), or escalate to Exceptions. Exceptions is decided by an owner or
        approver: approve, reject (note required: why), or other (note required; back to the operator). A missing
        or blank note is 400 `note_required`. Automatic
        matches are not decided. The tray is the stored one and the role is
        the caller's current membership, read when deciding. A decision is
        never edited: a second decision in the same tray is 409 `conflict`;
        an action the tray does not offer is 400.

        `revert` undoes the latest decision in effect as a new recorded row
        (the client's in Exceptions, else the operator's in Suggested), by
        whoever decides that tray. 409 `nothing_to_revert` when nothing is in
        effect, 409 `period_closed` when the period is closed.

        A client's `reject` in Exceptions sends each movement of the match
        back to the operator: it lists in Suggested with reason
        `client_rejected`, the client's note and the rejected `matchId`, and
        the operator answers it like `client_other` (see decideMovement).
        The client reverts its reject here, only while the operator has not
        answered: otherwise 409 `operator_answered`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: matchId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionRequest" }
      responses:
        "201":
          description: recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/matching/movements/{movementId}/decision:
    post:
      operationId: decideMovement
      tags: [matching]
      summary: Decide on a movement with no candidate (the client, then the operator)
      description: |
        For a movement in the Exceptions tray without any candidate ("Sin
        propuesta: contanos qué es"). `other`: note required, the movement
        goes back to the operator. `link`: link it by hand to open items
        whose amounts add up exactly to the movement (any difference is an
        adjustment and stays with the operator); creates a match with rule
        `manual_link`. `revert`: undo the decision in effect, as a new
        recorded row. Role read from the current membership.
        The client (owner or approver) may `other`, `link` and `revert`
        its own decision. Once the client said `other`, or rejected the
        match proposed for the movement (`client_rejected`, see
        decideMatch), the movement is with the operator, who may `resolve`
        it (note required: what was done with it), `link` it, or `return` it
        to the client (note required: what the operator needs); `revert`
        undoes the operator's row and puts the client's decision back in
        effect. A returned movement is back in the client's Exceptions with
        reason `operator_returned`, and the client decides again with
        `other` or `link`. A client's reject is reverted on the match, not
        here (409 `revert_on_match`).
        409 codes: `conflict` (already decided), `not_in_exceptions`,
        `not_with_operator`, `revert_on_match`, `item_taken`,
        `nothing_to_revert`, `period_closed`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: movementId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovementDecisionRequest" }
      responses:
        "201":
          description: recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementDecision" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /v1/me/tenant:
    get:
      operationId: getMyTenant
      tags: [portal]
      summary: Onboarding status of the active tenant (portal home)
      description: |
        Three steps, each verified on its own:
        - `arca`: always `pending` for now. A CUIT on file is not a
          verification, and a constancia lookup proves the CUIT exists, not
          that the client delegated anything to Tramo.
        - `bank`: `verified` once any account has an accepted statement.
        - `erp`: `pending` (no ERP connector yet).
        `openExceptions` counts what waits for the client in Exceptions.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantStatus" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/tenants:
    get:
      operationId: listTenants
      tags: [portal]
      summary: Tenants where the caller is operator or accountant (operator console)
      description: |
        Built from the caller's own memberships; each tenant is read under
        its own tenant scope. 403 when the caller is operator or accountant
        nowhere.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TenantStatus" }
                  nextCursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/metrics:
    get:
      operationId: listMetrics
      tags: [portal]
      summary: Results panel of the active tenant for a month
      description: |
        Numbers of this tenant for one month, computed from what is stored
        for the tenant (internal/matching/README.md, "Metrics"). Each metric
        says what it counts (`source`) and where its rows are (`list`). With
        nothing to measure the status is `no_data` and the value is null,
        never zero. They describe this tenant's data, not the product.
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$", example: "2026-11" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Metric" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
  /v1/exports:
    get:
      operationId: listExports
      tags: [portal]
      summary: What the client can download, with row counts
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ExportInfo" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/exports/{kind}:
    get:
      operationId: getExport
      tags: [portal]
      summary: Download one export as CSV
      description: |
        `movements`, `matches` and `audit`. Optional `from` and `to` (dates,
        inclusive) bound the rows; for `matches`, by the date of their
        movements. A match row carries its rule and version, tray, links,
        adjustments and the decision in effect (who, role, when, revision).
        Cells that a spreadsheet would read as a formula are prefixed with
        a quote.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [movements, matches, audit]
            x-enum-varnames: [KindMovements, KindMatches, KindAudit]
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: CSV, UTF-8, comma separated, header row first
          headers:
            Content-Disposition: { schema: { type: string } }
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client generated UUID. Same key and same body replays the first
        response for 24 hours; same key with another body is 422; a key
        whose first request is still running is 409.
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PeriodFilter:
      name: period
      in: query
      required: false
      description: A month, YYYY-MM. Not together with from and to (400).
      schema: { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$", example: "2026-11" }
    RangeFrom:
      name: from
      in: query
      required: false
      description: |
        First day of a range of civil dates, included. Goes with `to`: one
        without the other is 400, and so is either one together with
        `period`. The range filters by the same date `period` does.
      schema: { type: string, format: date, example: "2026-11-01" }
    RangeTo:
      name: to
      in: query
      required: false
      description: |
        Last day of the range, INCLUDED, as in /v1/exports/{kind} (a
        fortnight is from=2026-11-01&to=2026-11-15). 400 when before `from`.
      schema: { type: string, format: date, example: "2026-11-15" }
    RefreshCookie:
      name: tramo_refresh
      in: cookie
      required: false
      description: Refresh token for browsers (HttpOnly, Secure, SameSite=Strict, Path=/v1/auth).
      schema: { type: string }
  responses:
    Tokens:
      description: tokens issued
      headers:
        Set-Cookie:
          description: refresh token cookie when tokenDelivery is cookie
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Tokens" }
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Unprocessable Entity }
        status: { type: integer, example: 422 }
        code:
          type: string
          description: Stable machine readable error code.
          example: idempotency_key_reused
        detail: { type: string }
        requestId: { type: string }
        magicLink:
          type: boolean
          description: |
            On a login 429 for the email and IP pair: a magic link
            (POST /v1/auth/magic-link) still lets the person in.
    OnboardingStep:
      type: object
      required: [kind, status, detail]
      properties:
        kind:
          type: string
          enum: [arca, bank, erp]
          x-enum-varnames: [StepArca, StepBank, StepErp]
        status:
          type: string
          enum: [verified, pending, failed]
          x-enum-varnames: [StepVerified, StepPending, StepFailed]
        detail:
          type: string
          description: Why the step has this status, in English, for the UI to translate.
        verifiedAt: { type: string, format: date-time, nullable: true }
    TenantStatus:
      type: object
      required: [id, name, role, steps, openExceptions, openExceptionsCapped]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        cuit:
          allOf: [{ $ref: "#/components/schemas/Cuit" }]
          nullable: true
        role:
          allOf: [{ $ref: "#/components/schemas/Role" }]
          description: The caller's role in this tenant.
        steps:
          type: array
          items: { $ref: "#/components/schemas/OnboardingStep" }
        openExceptions:
          type: integer
          description: Matches and movements waiting for the client in Exceptions.
        openExceptionsCapped:
          type: boolean
          description: True when the count stopped at its cap (1000 of each kind).
        toClose:
          type: array
          description: |
            Periods that are over and not closed yet ("para cerrar"), oldest
            first, as the fortnightly job marked them. Nothing closes by
            itself: an operator closes each one.
          items: { $ref: "#/components/schemas/PeriodRange" }
    Metric:
      type: object
      required: [key, label, status, value, unit, period, source, list]
      properties:
        key: { type: string, example: automation_rate }
        label: { type: string }
        status:
          type: string
          description: |
            `no_data` when there is nothing to measure yet (no movements, no
            run, nothing decided). It is not zero and is shown differently.
          enum: [measured, no_data]
          x-enum-varnames: [MetricMeasured, MetricNoData]
        value:
          type: number
          format: double
          nullable: true
          description: Null when status is no_data.
        unit:
          type: string
          enum: [percent, count, cents, days, hours]
          x-enum-varnames: [UnitPercent, UnitCount, UnitCents, UnitDays, UnitHours]
        period: { type: string, example: "2026-11" }
        source:
          type: string
          description: What the number counts, over which rows, shown next to it.
        list:
          type: string
          description: API path that returns the rows behind the number (a list or a CSV export).
          example: /v1/matching/matches?tray=auto&period=2026-11
    InvoiceSummary:
      type: object
      required: [id, autoEligible, minConfidence, missing, createdAt]
      properties:
        id: { type: string, format: uuid }
        issuerCuit: { type: string }
        docType: { type: integer }
        pointOfSale: { type: integer }
        number: { type: integer, format: int64 }
        issueDate: { type: string, format: date }
        total: { $ref: "#/components/schemas/Cents" }
        autoEligible: { type: boolean }
        minConfidence: { type: number, format: double }
        missing:
          type: array
          items: { type: string }
        itemReason: { $ref: "#/components/schemas/ItemReason" }
        createdAt: { type: string, format: date-time }
    ExportInfo:
      type: object
      required: [kind, format, available]
      properties:
        kind:
          type: string
          enum: [movements, matches, audit]
          x-enum-varnames: [ExportMovements, ExportMatches, ExportAudit]
        format: { type: string, enum: [csv], x-enum-varnames: [ExportCSV] }
        available: { type: boolean }
        rows: { type: integer, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
    Role:
      type: string
      enum: [owner, approver, viewer, operator, accountant]
    Cuit:
      type: string
      pattern: "^[0-9]{11}$"
      description: CUIT, 11 digits without dashes. The check digit is verified.
      example: "30000000015"
    Password:
      type: string
      minLength: 12
      maxLength: 128
      format: password
    TokenDelivery:
      type: string
      enum: [cookie, body]
      default: cookie
    RegisterRequest:
      type: object
      required: [email, password, tenantName, tenantSlug]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: "#/components/schemas/Password" }
        tenantName: { type: string, minLength: 2, maxLength: 120 }
        tenantSlug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$" }
        cuit: { $ref: "#/components/schemas/Cuit" }
        name: { $ref: "#/components/schemas/PersonName" }
    PersonName:
      type: string
      minLength: 1
      maxLength: 120
      description: The person's name as they want it shown. Personal data; no format check.
    UpdateMeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/PersonName" }
    RegisterResponse:
      type: object
      required: [userId, tenantId]
      properties:
        userId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128, format: password }
        tenantId:
          type: string
          format: uuid
          description: Tenant to act on. Defaults to the oldest membership.
        tokenDelivery: { $ref: "#/components/schemas/TokenDelivery" }
    PreviewInviteRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 43, maxLength: 64 }
    InvitePreview:
      type: object
      required: [tenantName, role]
      additionalProperties: false
      properties:
        tenantName: { type: string, description: The inviting company's name. }
        role: { $ref: "#/components/schemas/Role" }
    AcceptInviteRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 43, maxLength: 64 }
        password: { $ref: "#/components/schemas/Password" }
        name: { $ref: "#/components/schemas/PersonName" }
        tokenDelivery: { $ref: "#/components/schemas/TokenDelivery" }
    MagicLinkRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        tenantId:
          type: string
          format: uuid
          description: Tenant to open the session on. Defaults to the oldest membership.
    MagicLinkAcceptRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 43, maxLength: 64 }
        tokenDelivery: { $ref: "#/components/schemas/TokenDelivery" }
    SwitchTenantRequest:
      type: object
      required: [tenantId]
      additionalProperties: false
      properties:
        tenantId: { type: string, format: uuid }
        refreshToken: { type: string, maxLength: 128 }
        tokenDelivery: { $ref: "#/components/schemas/TokenDelivery" }
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken: { type: string, maxLength: 128 }
        tokenDelivery: { $ref: "#/components/schemas/TokenDelivery" }
    Tokens:
      type: object
      required: [accessToken, tokenType, expiresIn, tenantId, role]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, description: seconds, example: 600 }
        refreshToken:
          type: string
          description: Only with tokenDelivery body.
        tenantId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
    Membership:
      type: object
      required: [tenantId, tenantName, role]
      properties:
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    Me:
      type: object
      required: [userId, email, name, activeTenantId, role, memberships]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        name:
          type: string
          nullable: true
          description: The person's name, null until they set one (show the email then).
        activeTenantId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
    Member:
      type: object
      required: [userId, email, name, role, status]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        name:
          type: string
          nullable: true
          description: The person's name, null until they set one.
        role: { $ref: "#/components/schemas/Role" }
        status:
          type: string
          enum: [active, pending]
          description: pending until the person accepts the invitation (D-19).
    AddMemberRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: "#/components/schemas/Role" }
    ConnectMercadoPagoRequest:
      type: object
      required: [code, state]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 512 }
        state: { type: string, minLength: 1, maxLength: 128 }
    MercadoPagoConnection:
      type: object
      required: [configured, status, revokeInMercadoPago]
      properties:
        configured:
          type: boolean
          description: False while the app's credentials are not set; nothing can connect.
        status:
          type: string
          enum: [disconnected, connected, needs_reconnect]
          description: |
            needs_reconnect: Mercado Pago stopped accepting the tokens (the
            seller removed the app, changed their password, or the
            authorization expired); they were deleted and the owner connects
            again.
        mpUserId: { type: string, description: The Mercado Pago account connected. }
        connectedAt: { type: string, format: date-time }
        connectedBy: { type: string, format: uuid }
        tokenExpiresAt: { type: string, format: date-time, description: When the current access token expires; it is renewed before. }
        lastRefreshAt: { type: string, format: date-time }
        lastErrorCode:
          type: string
          enum: [revoked, mp_unavailable]
          description: |
            The last problem talking to Mercado Pago, as a code (never
            Mercado Pago's text). revoked: Mercado Pago answered invalid_grant.
            mp_unavailable: no proper answer; it is retried.
        lastErrorAt: { type: string, format: date-time }
        lastImportAt:
          type: string
          format: date-time
          description: |
            When movements from Mercado Pago were last accepted. Absent until
            the first accepted import, so connected without it reads as
            "conectado, sin importar todavía". Importing is not built yet
            (ADR 0010, open question on the report's API), so today it is
            always absent.
        lastSyncCode:
          type: string
          enum: [imported, stopped_by_quarantine, mp_unavailable]
          description: |
            How the last sync ended, as a code. imported: the report was
            accepted (or was already there). stopped_by_quarantine: a file
            went to quarantine; the sync waits, without retrying, until an
            operator resolves it. mp_unavailable: Mercado Pago did not answer;
            the next run retries. Absent until the first sync, so today
            always absent.
        lastSyncAt: { type: string, format: date-time, description: When the last sync ended. Absent until the first. }
        revokeInMercadoPago:
          type: boolean
          description: |
            True right after a disconnect here: the authorization may still
            exist in Mercado Pago until the owner removes the app there.
    Inbox:
      type: object
      required: [address, senders, limits]
      properties:
        address:
          type: string
          nullable: true
          description: The full address (code@domain), or null before the owner creates one.
          example: k3p9w2m7q4x8z1v5c6b0n2r4t8@casilla.example
        createdAt: { type: string, format: date-time, description: When the current address was created. }
        senders:
          type: array
          items: { $ref: "#/components/schemas/InboxSender" }
        limits: { $ref: "#/components/schemas/InboxLimits" }
    InboxLimits:
      type: object
      description: What a message may carry; past any of them it is refused.
      required: [attachmentsPerMessage, bytesPerAttachment, bytesPerMessage, messagesPerDay, messagesPerSenderPerDay, kinds]
      properties:
        attachmentsPerMessage: { type: integer, example: 10 }
        bytesPerAttachment: { type: integer, example: 20971520 }
        bytesPerMessage: { type: integer, example: 26214400 }
        messagesPerDay: { type: integer, example: 200 }
        messagesPerSenderPerDay: { type: integer, example: 50 }
        kinds:
          type: array
          items: { type: string }
          example: [csv, txt, xls, xlsx, pdf]
    InboxSender:
      type: object
      required: [id, email, addedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        addedAt: { type: string, format: date-time }
        addedBy: { type: string, format: uuid }
    AddInboxSenderRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
    InboxReceipt:
      type: object
      required: [id, receivedAt, sender, status, attachments]
      properties:
        id: { type: string, format: uuid }
        receivedAt: { type: string, format: date-time }
        sender: { type: string, description: The From address, lowercased. }
        status:
          type: string
          enum: [accepted, refused]
          description: accepted when the message passed every check; each attachment then says what happened to it.
        reason:
          type: string
          description: |
            With refused. sender_not_authorized: the From is not one the
            owner authorized. not_authenticated: neither SPF nor DKIM aligns
            with the From's domain. too_many_attachments, message_too_large:
            past the message limits. daily_limit, sender_daily_limit: past
            the day's limits (Argentina's day).
          enum: [sender_not_authorized, not_authenticated, too_many_attachments, message_too_large, daily_limit, sender_daily_limit]
        attachments:
          type: array
          items: { $ref: "#/components/schemas/InboxAttachment" }
    InboxAttachment:
      type: object
      required: [filename, size, status]
      properties:
        filename: { type: string }
        size: { type: integer, format: int64, description: Bytes read; with too_large, the limit it stopped at. }
        sha256: { type: string, description: Hex, when the whole attachment was read. }
        status:
          type: string
          enum: [delivered, not_delivered, refused]
          description: |
            delivered: handed to ingestion (ingest says what it did).
            not_delivered: ingestion without an account is not available
            yet; nothing was stored. refused: not a statement kind or too
            large (reason).
        reason:
          type: string
          enum: [unsupported_kind, too_large]
        ingest: { $ref: "#/components/schemas/IngestResult" }
    ClosePeriodRequest:
      type: object
      required: [periodStart]
      additionalProperties: false
      properties:
        periodStart: { type: string, format: date, example: "2026-11-01" }
    PeriodRange:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date, example: "2026-10-01", description: The period's first day. }
        to: { type: string, format: date, example: "2026-10-15", description: The period's last day, included. }
    Close:
      type: object
      required: [id, cadence, periodStart, periodEnd, closedAt, closedBy, summary]
      properties:
        id: { type: string, format: uuid }
        cadence:
          type: string
          enum: [fortnight]
          description: The cadence the period was cut with. Fortnight is the default (D-6).
        periodStart: { type: string, format: date, example: "2026-11-01" }
        periodEnd:
          type: string
          format: date
          example: "2026-11-15"
          description: The period's last day, included.
        closedAt: { type: string, format: date-time }
        closedBy: { type: string, format: uuid, description: The operator who closed it. }
        summary:
          type: array
          description: |
            The numbers of the period as they were when it closed, frozen:
            the same metrics as the results panel, each with its source and
            the list it comes from. Open Exceptions are in here. Each
            metric's period is the range, first and last day included
            (2026-11-01/2026-11-15).
          items: { $ref: "#/components/schemas/Metric" }
    CloseRefused:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            pendingSuggested:
              type: integer
              description: With suggested_pending, the Suggested items left in the period.
    Cents:
      type: integer
      format: int64
      description: Amount in cents. Credits positive, debits negative.
    Bank:
      type: string
      enum: [galicia, santander, bancor, macro, mercadopago]
    Account:
      type: object
      required: [id, bank, name, currency]
      properties:
        id: { type: string, format: uuid }
        bank: { $ref: "#/components/schemas/Bank" }
        number: { type: string }
        name: { type: string }
        currency: { type: string, example: ARS }
    CreateAccountRequest:
      type: object
      required: [bank, name]
      additionalProperties: false
      properties:
        bank: { $ref: "#/components/schemas/Bank" }
        number:
          type: string
          maxLength: 40
          description: When set, a file that states another account number is quarantined.
        name: { type: string, minLength: 1, maxLength: 120 }
    IngestResult:
      type: object
      required: [status, fileHash, new, alreadyPresent]
      properties:
        status: { type: string, enum: [accepted, duplicate, quarantined] }
        reason:
          type: string
          description: |
            Set when quarantined. movement_conflict: a line has the identity of a stored movement
            (account, date, amount, running balance, references) but another description; it is
            never stored twice and never overwritten, an operator looks at it. unsupported_format:
            not a file kind statements come in, or a spreadsheet past the size, row or cell
            limits, or whose sheets cannot be told apart. unrouted: a readable file that arrived
            without an account (by mail) and that no single account of the tenant matches by bank and
            number; a mailed file that cannot be read keeps its reading reason (unknown_layout,
            unsupported_format, row_parse), never unrouted. period_closed: it brings
            new movements dated in a closed period; nothing enters (closedPeriod names the range).
          enum: [unknown_layout, bank_mismatch, account_mismatch, row_parse, incomplete, balance_mismatch, chain_gap, empty, movement_conflict, unsupported_format, unrouted, period_closed]
        closedPeriod:
          allOf: [{ $ref: "#/components/schemas/PeriodRange" }]
          description: With period_closed, the closed period the file's new movements fall in (the earliest one).
        detail: { type: string }
        fileHash: { type: string, description: SHA-256 of the file in hex. }
        fingerprint: { type: string }
        layoutId: { type: string, example: bancor/csv-v1 }
        new: { type: integer, description: Movements stored by this upload. }
        alreadyPresent: { type: integer, description: Movements an earlier upload already had. }
        accountId:
          type: string
          format: uuid
          description: |
            The account the file went to. Absent when it arrived by mail without an account
            and was not assigned: unrouted, or unreadable (reason says which).
        source: { $ref: "#/components/schemas/IngestSource" }
        routed: { $ref: "#/components/schemas/RoutedBy" }
    IngestSource:
      type: string
      enum: [upload, mail]
      description: How the file came in, uploaded in the portal or mailed to the tenant's mailbox (D-22).
    RoutedBy:
      type: string
      enum: [number, single_account]
      description: |
        Only for a mailed file that was assigned: number, the account number
        read in the file matched one account; single_account, the file states
        no number and the tenant has a single account of that bank.
    UploadedFile:
      type: object
      required: [id, status, receivedAt]
      properties:
        id: { type: string, format: uuid }
        accountId:
          type: string
          format: uuid
          description: |
            The account the file went to. Absent only for a file that arrived
            by mail without an account and was not assigned: quarantined as
            unrouted (readable, but no single account matches its bank and
            number) or with a reading reason (unknown_layout,
            unsupported_format, row_parse).
        accountName: { type: string, description: Absent exactly when accountId is. }
        bank:
          allOf: [{ $ref: "#/components/schemas/Bank" }]
          x-go-type-skip-optional-pointer: true
          description: |
            The bank of the account, or the one read from the file. Absent only
            when a file arrived by mail without an account and could not be read.
        source: { $ref: "#/components/schemas/IngestSource" }
        routed: { $ref: "#/components/schemas/RoutedBy" }
        filename: { type: string }
        status: { type: string, enum: [accepted, quarantined] }
        reason: { type: string, description: Set when quarantined (see IngestResult.reason). }
        closedPeriod:
          allOf: [{ $ref: "#/components/schemas/PeriodRange" }]
          description: With reason period_closed, the closed period it hit.
        detail: { type: string }
        layoutId: { type: string }
        from: { type: string, format: date, description: First day of the statement, when accepted. }
        to: { type: string, format: date, description: Last day of the statement, when accepted. }
        movements: { type: integer, description: Movements this file stored (the rest were already present). Accepted only. }
        receivedAt: { type: string, format: date-time }
        uploadedBy: { type: string, format: uuid }
        uploadedByEmail: { type: string }
    LedgerMovement:
      type: object
      required: [id, accountId, accountName, bank, fileId, line, date, amount, description]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        bank: { $ref: "#/components/schemas/Bank" }
        fileId: { type: string, format: uuid, description: The file that stored it. }
        line: { type: integer, description: Line of that file. }
        date: { type: string, format: date }
        amount: { type: integer, format: int64, description: Cents, credits positive. }
        balance: { type: integer, format: int64, description: Running balance after the line, when the file has it. }
        description: { type: string, description: As the bank wrote it. }
        reference: { type: string }
        externalRef: { type: string }
    QuarantinedFile:
      type: object
      required: [id, accountId, reason, receivedAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        filename: { type: string }
        reason: { type: string }
        detail: { type: string }
        fingerprint: { type: string }
        receivedAt: { type: string, format: date-time }
    InvoiceField:
      type: object
      required: [value, source, confidence, trusted]
      properties:
        value: { type: string }
        source: { type: string, enum: [arca_qr, pdf_text, ocr, llm, manual] }
        confidence: { type: number, format: double, minimum: 0, maximum: 1 }
        trusted: { type: boolean, description: Can feed registration or an automatic match on its own. }
        conflictValue: { type: string, description: Another source read a different value. }
        conflictSource: { type: string }
        note: { type: string }
    ItemReason:
      type: string
      description: |
        Why the invoice generated no open item for matching (absent when it
        did): no_tenant_cuit (the tenant has no CUIT on file),
        missing_total_or_date (no trusted total or issue date),
        foreign_currency (not pesos; no conversion is guessed),
        unknown_direction (no issuer to tell the tenant's side),
        not_this_tenant (trusted issuer and receiver are both someone else;
        never auto eligible).
      enum: [no_tenant_cuit, missing_total_or_date, foreign_currency, unknown_direction, not_this_tenant]
    Invoice:
      type: object
      required: [id, fields, autoEligible, minConfidence, missing, trail]
      properties:
        id: { type: string, format: uuid }
        fields:
          type: object
          description: By field name (issuer_cuit, doc_type, point_of_sale, number, issue_date, total, auth_code, ...).
          additionalProperties: { $ref: "#/components/schemas/InvoiceField" }
        autoEligible: { type: boolean }
        minConfidence: { type: number, format: double }
        itemReason: { $ref: "#/components/schemas/ItemReason" }
        missing:
          type: array
          items: { type: string }
        trail:
          type: array
          items: { type: string }
    RunRequest:
      type: object
      required: [period]
      additionalProperties: false
      properties:
        period: { type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$", example: "2026-10" }
    RunSummary:
      type: object
      required: [runId, period, matches, new, pending, exceptions]
      properties:
        runId: { type: string, format: uuid }
        period: { type: string }
        matches: { type: integer }
        new: { type: integer }
        pending: { type: integer }
        exceptions: { type: integer }
    Adjustment:
      type: object
      required: [kind, amount, source]
      properties:
        kind: { type: string, example: mp_fee }
        amount: { $ref: "#/components/schemas/Cents" }
        source: { type: string, enum: [documented_by_source, rounding_tolerance] }
    Match:
      type: object
      required: [id, rule, ruleVersion, tray, movementIds, itemIds, adjustments, crossPeriod, lowConfidence]
      properties:
        id: { type: string }
        rule: { type: string, example: reference_exact }
        ruleVersion: { type: integer }
        tray:
          type: string
          description: Where the match waits now; a suggested match an operator escalated is in exception.
          enum: [auto, suggested, exception]
        movementIds:
          type: array
          items: { type: string, format: uuid }
        itemIds:
          type: array
          items: { type: string, format: uuid }
        adjustments:
          type: array
          items: { $ref: "#/components/schemas/Adjustment" }
        reference: { type: string }
        dateDiffDays: { type: integer }
        crossPeriod: { type: boolean }
        lowConfidence: { type: boolean }
    OpenItem:
      type: object
      required: [id, source, sourceId, kind, date, amount, refs, confidence]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, description: "erp, document or manual." }
        sourceId: { type: string, description: The id in its source (for a document, the invoice it came from). }
        kind: { type: string, example: receivable }
        date: { type: string, format: date }
        due: { type: string, format: date }
        amount: { type: integer, format: int64, description: Cents, with the sign it will have in the bank. }
        refs: { type: array, items: { type: string } }
        party: { type: string, description: The CUIT on the other side, when known. }
        confidence: { type: number, description: Below the automatic threshold it can only be suggested. }
        invoiceId: { type: string, format: uuid, description: The invoice that generated it, when it came from one. }
    Candidate:
      type: object
      required: [rule, itemIds]
      properties:
        rule: { type: string }
        itemIds:
          type: array
          items: { type: string, format: uuid }
    PendingMovement:
      type: object
      required: [movementId, runId, tray, reason, candidates, date, amount, description, accountId, accountName, bank]
      properties:
        movementId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        date: { type: string, format: date, description: Date of the movement. }
        amount: { $ref: "#/components/schemas/Cents" }
        description: { type: string, description: As the bank wrote it. }
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        bank: { $ref: "#/components/schemas/Bank" }
        tray: { type: string, enum: [suggested, exception] }
        reason:
          type: string
          description: |
            ambiguous: two or more equally good candidates, all listed.
            shared_candidate: one candidate, which is also the only candidate of another movement; who takes it is not guessed.
            client_other is a movement the client said is something else, back with the operator.
            client_rejected is one whose proposed match the client rejected (matchId), back with the operator.
            operator_returned is one the operator sent back to the client, with the operator's note.
          enum: [ambiguous, shared_candidate, combination_ambiguous, reference_amount_differs, no_candidate, client_other, client_rejected, operator_returned]
        note: { type: string, description: "The client's note for client_other and client_rejected, the operator's for operator_returned." }
        matchId: { type: string, description: "The match the client rejected, for client_rejected." }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Candidate" }
    DecisionRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: [approve, reject, escalate, other, revert] }
        note: { type: string, maxLength: 500 }
    Decision:
      type: object
      required: [matchId, tray, action, userId, role, at, revision]
      properties:
        matchId: { type: string }
        tray: { type: string, enum: [suggested, exception] }
        action: { type: string, enum: [approve, reject, escalate, other, revert] }
        userId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        at: { type: string, format: date-time }
        note: { type: string }
        revision: { type: integer, description: Per match and tray; a revert is a new revision. }
    MovementDecisionRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: [other, link, resolve, return, revert] }
        note: { type: string, maxLength: 500 }
        itemIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
    MovementDecision:
      type: object
      required: [movementId, action, userId, role, at, revision]
      properties:
        movementId: { type: string, format: uuid }
        action: { type: string, enum: [other, link, resolve, return, revert] }
        matchId: { type: string, description: The manual match of a link (or of the link a revert undid). }
        note: { type: string }
        userId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        at: { type: string, format: date-time }
        revision: { type: integer }
