# sqlc: `make gen` turns each module's queries.sql into typed Go in
# internal/<module>/store. The schema is the goose migrations themselves.
# Modules add one entry each; never hand write row mapping.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/identity/queries.sql
    gen:
      go:
        package: store
        out: internal/identity/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        # Only the structs this module's queries use; other modules' tables
        # stay out of identity/store.
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
  - engine: postgresql
    schema: migrations
